static_resources:

  listeners:

  # ── Listener: MCP entry point (:8080) ─────────────────────────────────────────
  - name: mcp_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: mcp
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  timestamp:   "%START_TIME%"
                  user:        "%REQ(X-User-Email)%"
                  method:      "%REQ(:METHOD)%"
                  path:        "%REQ(:PATH)%"
                  response:    "%RESPONSE_CODE%"
                  duration_ms: "%DURATION%"

          http_filters:

          # ── 1. Strip any client-supplied identity headers (prevent spoofing) ──
          # Must run BEFORE jwt_authn so the real values from the validated
          # token are written by claim_to_headers after this strip.
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: |
                function envoy_on_request(handle)
                  handle:headers():remove("x-user-email")
                end

          # ── 2. JWT validation against Dex JWKS ───────────────────────────────
          # No client secret — pure signature/expiry/issuer/audience validation.
          # To use a different OIDC provider in production: swap the issuer and
          # remote_jwks URI to point at your provider's JWKS endpoint.
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                dex:
                  issuer: "http://localhost:5556"
                  remote_jwks:
                    http_uri:
                      # Fetch JWKS from Dex over the internal Docker network.
                      # 'issuer' above is validated against the token's 'iss'
                      # claim — these two URLs are independent in Envoy.
                      uri: "http://dex:5556/keys"
                      cluster: dex_jwks_cluster
                      timeout: 5s
                    cache_duration: 300s
                  forward: true               # keep JWT — forwarded to mcp-grafana → Grafana auth.jwt
                  payload_in_metadata: "jwt_payload"
                  claim_to_headers:
                    - header_name: "x-user-email"
                      claim_name: "email"
              rules:
                # OAuth discovery endpoints must be reachable before the client
                # has a token — allow unauthenticated access.
                - match: { prefix: "/.well-known/" }
                  requires: { allow_missing_or_failed: {} }
                - match: { prefix: "/" }
                  requires: { provider_name: "dex" }

          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          route_config:
            name: mcp_route
            virtual_hosts:
            - name: mcp_backend
              domains: ["*"]
              routes:
              # ── /.well-known/ → nginx metadata container ─────────────────────
              - match:
                  prefix: "/.well-known/"
                route:
                  cluster: well_known_cluster

              # ── Everything else → mcp-grafana ────────────────────────────────
              - match:
                  prefix: "/"
                route:
                  cluster: mcp_grafana_cluster
                  timeout: 300s       # long-lived connections (SSE / streamable-http)
                  upgrade_configs:
                  - upgrade_type: websocket

  clusters:

  # ── Dex JWKS endpoint (internal Docker network, plain HTTP) ──────────────────
  - name: dex_jwks_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: dex_jwks_cluster
      endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: dex
                  port_value: 5556

  # ── mcp-grafana upstream (internal Docker network) ───────────────────────────
  - name: mcp_grafana_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: mcp_grafana_cluster
      endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: mcp-grafana
                  port_value: 8000

  # ── well-known nginx container (internal Docker network) ─────────────────────
  - name: well_known_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: well_known_cluster
      endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: well-known
                  port_value: 80
