---
# Grafana MCP — Option A: Envoy + Dex + Grafana (JWT forwarding via Envoy)
#
# Auth flow:
#   MCP Client ──PKCE──► Dex :5556 (OIDC provider)
#   MCP Client ──Bearer JWT──► Envoy :8080
#   Envoy validates JWT against Dex JWKS, sets X-User-Email, forwards JWT
#   Envoy ──Bearer JWT──► mcp-grafana :8000
#   mcp-grafana ──Bearer JWT──► Grafana :3000
#   Grafana auth.jwt validates JWT against Dex JWKS
#
# Grafana identity: per-user — Dex user maps to a real Grafana account
# Envoy acts as a validating gateway; Grafana re-validates independently
#
# Quick start:
#   docker compose up -d
#   Open http://localhost:3000 — click "Sign in with Dex"
#   Configure your MCP client: http://localhost:8080/mcp
#   Credentials: user@example.com / password

services:

  # ── 1. Dex ───────────────────────────────────────────────────────────────────
  # Local OIDC provider. Swap issuer + JWKS URI in envoy.yaml to use any
  # other OIDC provider (Keycloak, Auth0, Google, etc.) in production.
  dex:
    image: dexidp/dex:v2.45.1
    container_name: mcp-dex
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"     # OIDC endpoints — reachable by browser and Envoy JWKS fetch
    networks:
      - mcp-net

  # ── 2. Envoy ─────────────────────────────────────────────────────────────────
  # JWT validation + routing.
  # Validates Dex tokens against JWKS; strips token before mcp-grafana.
  # To use a different OIDC provider: change issuer + remote_jwks URI in envoy.yaml.
  envoy:
    image: envoyproxy/envoy:v1.38-latest
    container_name: mcp-envoy
    restart: unless-stopped
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"     # MCP entry point — configure your MCP client here
      - "9901:9901"     # Envoy admin UI (optional)
    depends_on:
      - dex
      - mcp-grafana
      - well-known
    networks:
      - mcp-net

  # ── 3. mcp-grafana ───────────────────────────────────────────────────────────
  # MCP server. Receives the Dex JWT from Envoy via Authorization header
  # and forwards it to Grafana. No SA token needed.
  mcp-grafana:
    image: grafana/mcp-grafana:0.14.0
    container_name: mcp-grafana
    restart: unless-stopped
    command:
      - --transport=streamable-http
      - --address=0.0.0.0:8000
      - --endpoint-path=/mcp
      - --disable-write
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_FORWARD_HEADERS: "Authorization"   # forward Dex JWT — no SA token
    expose:
      - "8000"          # internal only — access via Envoy on :8080
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - mcp-net

  # ── 4. Grafana ───────────────────────────────────────────────────────────────
  # auth.jwt validates incoming Bearer tokens directly against Dex JWKS.
  # Generic OAuth adds a "Sign in with Dex" button for browser login.
  # auto_sign_up = true for local convenience — set to false in production.
  grafana:
    image: grafana/grafana:13.0.1
    container_name: mcp-grafana-server
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Allow http:// URLs — requires development mode
      GF_DEFAULT_APP_MODE: "development"
      # JWT auth — validate Dex tokens forwarded by mcp-grafana
      GF_AUTH_JWT_ENABLED: "true"
      GF_AUTH_JWT_HEADER_NAME: "Authorization"
      GF_AUTH_JWT_HEADER_VALUE_PREFIX: "Bearer"
      GF_AUTH_JWT_JWK_SET_URL: "http://dex:5556/keys"
      GF_AUTH_JWT_EMAIL_CLAIM: "email"
      GF_AUTH_JWT_USERNAME_CLAIM: "email"
      GF_AUTH_JWT_AUTO_SIGN_UP: "true"
      # Generic OAuth — "Sign in with Dex" button on Grafana login page.
      # To use a different OIDC provider: swap the AUTH/TOKEN/API URLs below.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Dex"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "grafana-dex-secret"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://localhost:5556/auth"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://dex:5556/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "http://dex:5556/userinfo"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "email"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_AUTO_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcp-net

  # ── 5. Prometheus ─────────────────────────────────────────────────────────────
  # Local Prometheus scraping itself. Provides real metric data for MCP tool demos.
  prometheus:
    image: prom/prometheus:latest
    container_name: mcp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose:
      - "9090"          # internal only — accessed by Grafana datasource
    networks:
      - mcp-net

  # ── 6. well-known ────────────────────────────────────────────────────────────
  # Serves /.well-known/oauth-protected-resource via Envoy routing.
  # Tells MCP clients where to find the authorization server (Dex).
  well-known:
    image: nginx:alpine
    container_name: mcp-well-known
    restart: unless-stopped
    volumes:
      - ./well-known:/usr/share/nginx/html/.well-known:ro
      - ./nginx-well-known.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"            # internal only — accessed via Envoy routing
    networks:
      - mcp-net

volumes:
  grafana-data:

networks:
  mcp-net:
    driver: bridge
